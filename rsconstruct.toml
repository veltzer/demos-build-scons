# rsconstruct build configuration for this repository.

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["examples/many_environments"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.cppcheck]
src_dirs = ["examples", "examples_standalone/embed_scons"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_dirs = ["examples"]
args = ["-c", ".eslint.config.js"]
